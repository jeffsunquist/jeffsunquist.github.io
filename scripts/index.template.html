<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physics Lesson Slides</title>
  <meta name="description" content="Grade 6 and 7 Physics lesson decks and handouts." />
  <style>
    /* --- Self-hosted handwriting font (Patrick Hand, SIL OFL) ---
       Copied into dist/fonts/ by scripts/deploy.sh. */
    @font-face {
      font-family: 'Patrick Hand';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/PatrickHand-Regular.ttf') format('truetype');
    }

    :root {
      --ink: #1f2937;
      --muted: #6b7280;
      --faint: #9ca3af;
      --line: #e5e7eb;
      --paper: #ffffff;
      --card: #ffffff;
      --link: #0b57d0;
      --g6: #0d9488;
      --g6-soft: #ccfbf1;
      --g7: #d97706;
      --g7-soft: #fef3c7;
      --hand: 'Patrick Hand', ui-sans-serif, system-ui, sans-serif;
      --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background-color: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--link); text-decoration: none; }

    /* --- Hero --- */

    .hero {
      text-align: center;
      padding: 3.5rem 1rem 2.25rem;
      background: linear-gradient(180deg, #ffffff 0%, rgba(251, 250, 246, 0) 100%);
    }

    .hero h1 {
      font-family: var(--hand);
      font-weight: 400;
      font-size: clamp(2.6rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0.01em;
      margin: 0;
      color: var(--ink);
    }

    .hero .subtitle {
      font-family: var(--hand);
      font-size: clamp(1.15rem, 2.5vw, 1.5rem);
      color: var(--muted);
      margin: 0.5rem 0 0;
    }

    .hero .watermark {
      margin: 1.1rem 0 0;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--faint);
      opacity: 0.85;
    }

    /* --- Toolbar (grade filter) --- */

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .toolbar-inner {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .segmented button {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .segmented button:hover { color: var(--ink); }

    .segmented button.active {
      background: var(--ink);
      color: #fff;
    }

    /* --- Page layout --- */

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }

    section { margin-top: 2.25rem; }
    section[hidden] { display: none; }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin: 0 0 1.1rem;
    }

    .section-head h2 {
      font-family: var(--hand);
      font-weight: 400;
      font-size: 2rem;
      margin: 0;
      color: var(--ink);
    }

    .section-head .rule {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 780px) {
      .columns { grid-template-columns: 1fr; gap: 1.5rem; }
    }

    .column[hidden] { display: none; }

    .column[data-grade='6'] { --accent: var(--g6); --accent-soft: var(--g6-soft); }
    .column[data-grade='7'] { --accent: var(--g7); --accent-soft: var(--g7-soft); }

    .column > h3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--hand);
      font-weight: 400;
      font-size: 1.4rem;
      color: var(--accent);
      margin: 0 0 0.9rem;
    }

    .grade-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    /* --- Cards --- */

    .card {
      display: flex;
      gap: 0.9rem;
      padding: 0.95rem 1.05rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--ink));
      border-radius: 0.8rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(16, 24, 40, 0.1);
    }

    .card[hidden] { display: none; }

    .card-icon {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--accent-soft, #f3f4f6);
      color: var(--accent, var(--ink));
    }

    .card-glyph {
      width: 24px;
      height: 24px;
      background-color: var(--accent, var(--ink));
      -webkit-mask: var(--icon) center / contain no-repeat;
      mask: var(--icon) center / contain no-repeat;
    }

    .card-body { min-width: 0; flex: 1; }

    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .code {
      font-family: var(--hand);
      font-size: 1rem;
      letter-spacing: 0.03em;
      color: var(--accent, var(--ink));
    }

    .lesson-no {
      flex: 0 0 auto;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      white-space: nowrap;
    }

    .card-title {
      font-family: var(--hand);
      font-weight: 400;
      font-size: 1.3rem;
      line-height: 1.2;
      margin: 0.1rem 0 0.25rem;
      color: var(--ink);
    }

    .card-desc {
      margin: 0;
      font-size: 0.84rem;
      line-height: 1.4;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Handout cards are a touch more compact. */
    .card.handout .card-icon {
      background: #f3f4f6;
      color: #4b5563;
    }

    .card.handout .card-glyph {
      background-color: #4b5563;
    }

    .empty {
      margin: 0.5rem 0 0;
      font-size: 0.9rem;
      color: var(--faint);
    }

    /* --- Aura tracker + element tier list --- */

    .aura-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 780px) {
      .aura-grid { grid-template-columns: 1fr; }
    }

    .chart-wrap {
      height: 360px;
      padding: 0.75rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    /* Tier list (styled after the Tiermaker template). Colors come from
       data/element_tier.csv via TIER_COLORS in the script below. */
    .tierlist {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px;
      background: #1b1a1a;
    }

    .tier-row { display: flex; gap: 4px; }

    .tier-label {
      flex: 0 0 auto;
      width: 52px;
      min-height: 52px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1;
    }

    .tier-slots {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
      padding: 6px;
      background: #363636;
    }

    .el-tile {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #1f2937;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1;
      border-radius: 4px;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--faint);
      padding: 0 1rem 2.5rem;
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Physics Lesson Slides</h1>
    <p class="subtitle">Grade 6 &amp; 7 Physics &middot; Scientific Inquiry &amp; Kinematics</p>
    <p class="watermark">Designed by Sunquist in Park Lane Harbor</p>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="segmented" role="group" aria-label="Filter by grade">
        <button type="button" data-grade="all" class="active">All</button>
        <button type="button" data-grade="6">Grade 6</button>
        <button type="button" data-grade="7">Grade 7</button>
      </div>
    </div>
  </div>

  <main>
    <section id="lessons-section">
      <div class="section-head">
        <h2>Lessons</h2>
        <span class="rule"></span>
      </div>
      <div class="columns">
        <div class="column" data-grade="6">
          <h3><span class="grade-dot"></span>Grade 6</h3>
          <div class="cards" id="lessons-g6"></div>
        </div>
        <div class="column" data-grade="7">
          <h3><span class="grade-dot"></span>Grade 7</h3>
          <div class="cards" id="lessons-g7"></div>
        </div>
      </div>
    </section>

    <section id="handouts-section">
      <div class="section-head">
        <h2>Handouts</h2>
        <span class="rule"></span>
      </div>
      <div class="columns">
        <div class="column" data-grade="6">
          <h3><span class="grade-dot"></span>Grade 6</h3>
          <div class="cards" id="handouts-g6"></div>
        </div>
        <div class="column" data-grade="7">
          <h3><span class="grade-dot"></span>Grade 7</h3>
          <div class="cards" id="handouts-g7"></div>
        </div>
      </div>
    </section>

    <section id="aura-section">
      <div class="section-head">
        <h2>Aura Tracker &amp; Element Tier List</h2>
        <span class="rule"></span>
      </div>
      <div class="aura-grid">
        <div class="tierlist" id="tierlist"></div>
        <div class="chart-wrap">
          <canvas id="auraChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <footer>Physics Lesson Slides &middot; basado.org</footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const LESSONS = __LESSONS_JSON__;
    const HANDOUTS = __HANDOUTS_JSON__;
    const AURA_LABELS = __AURA_LABELS__;
    const AURA_DATA = __AURA_DATA__;
    const ELEMENT_TIERS = __ELEMENT_TIERS_JSON__;

    /* --- Icons: standalone monochrome SVGs in public/icons/, tinted via CSS mask --- */

    function iconGlyph(url) {
      return '<span class="card-icon">' +
        '<span class="card-glyph" style="--icon:url(' + esc(url) + ')"></span>' +
        '</span>';
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* --- Render --- */

    function lessonCard(l) {
      const a = document.createElement('a');
      a.className = 'card lesson';
      a.href = l.url;
      const no = l.total ? 'Lesson ' + l.lesson + ' \u00b7 ' + l.total : '';
      a.innerHTML =
        iconGlyph(l.icon) +
        '<div class="card-body">' +
          '<div class="card-top">' +
            '<span class="code">' + esc(l.code) + '</span>' +
            '<span class="lesson-no">' + esc(no) + '</span>' +
          '</div>' +
          '<h4 class="card-title">' + esc(l.topic) + '</h4>' +
          '<p class="card-desc">' + esc(l.objective) + '</p>' +
        '</div>';
      return a;
    }

    function handoutCard(h) {
      const a = document.createElement('a');
      a.className = 'card handout';
      a.href = h.url;
      a.innerHTML =
        iconGlyph(h.icon) +
        '<div class="card-body">' +
          '<div class="card-top"><span class="code">Handout</span></div>' +
          '<h4 class="card-title">' + esc(h.label) + '</h4>' +
        '</div>';
      return a;
    }

    function fill(id, items, make) {
      const box = document.getElementById(id);
      items.forEach(function (it) { box.appendChild(make(it)); });
    }

    fill('lessons-g6', LESSONS.filter(function (l) { return l.g6; }), lessonCard);
    fill('lessons-g7', LESSONS.filter(function (l) { return l.g7; }), lessonCard);
    fill('handouts-g6', HANDOUTS.filter(function (h) { return h.g6; }), handoutCard);
    fill('handouts-g7', HANDOUTS.filter(function (h) { return h.g7; }), handoutCard);

    /* --- Grade filter --- */

    const gradeButtons = Array.prototype.slice.call(
      document.querySelectorAll('.segmented button'));
    let currentGrade = 'all';

    function applyFilters() {
      ['lessons-section', 'handouts-section'].forEach(function (sectionId) {
        const section = document.getElementById(sectionId);
        let anyVisible = false;
        section.querySelectorAll('.column').forEach(function (col) {
          const gradeOk = currentGrade === 'all' || currentGrade === col.dataset.grade;
          let colVisible = false;
          col.querySelectorAll('.card').forEach(function (card) {
            card.hidden = !gradeOk;
            if (gradeOk) colVisible = true;
          });
          col.hidden = !colVisible;
          if (colVisible) anyVisible = true;
        });
        section.hidden = !anyVisible;
      });
    }

    gradeButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentGrade = btn.dataset.grade;
        gradeButtons.forEach(function (b) { b.classList.toggle('active', b === btn); });
        applyFilters();
      });
    });

    /* --- Element tier list --- */

    const TIER_COLORS = {
      S: '#e05534', A: '#f2aa48', B: '#f7cf51', C: '#50ab64',
      D: '#4497f7', E: '#8d4cf6', F: '#e856f7'
    };

    function renderTierList() {
      const root = document.getElementById('tierlist');
      if (!root) return;
      ELEMENT_TIERS.forEach(function (row) {
        const rowEl = document.createElement('div');
        rowEl.className = 'tier-row';

        const label = document.createElement('div');
        label.className = 'tier-label';
        label.textContent = row.tier;
        label.style.background = TIER_COLORS[row.tier] || '#9ca3af';
        rowEl.appendChild(label);

        const slots = document.createElement('div');
        slots.className = 'tier-slots';
        (row.elements || []).forEach(function (symbol) {
          const tile = document.createElement('div');
          tile.className = 'el-tile';
          tile.textContent = symbol;
          slots.appendChild(tile);
        });
        rowEl.appendChild(slots);

        root.appendChild(rowEl);
      });
    }

    renderTierList();

    /* --- Aura tracker --- */

    const bestFitData = (function () {
      const n = AURA_DATA.length;
      if (!n) return [];
      const sx = (n - 1) * n / 2;
      let sy = 0, sxy = 0, sx2 = 0;
      AURA_DATA.forEach(function (y, x) { sy += y; sxy += x * y; sx2 += x * x; });
      const slope = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
      const intercept = (sy - slope * sx) / n;
      return AURA_DATA.map(function (_, x) { return intercept + slope * x; });
    })();

    new Chart(document.getElementById('auraChart'), {
      type: 'line',
      data: {
        labels: AURA_LABELS,
        datasets: [{
          data: AURA_DATA,
          borderColor: 'black',
          tension: 0.3,
          pointRadius: 3
        }, {
          label: 'line of best fit',
          data: bestFitData,
          borderColor: '#0b57d0',
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
          tension: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: 'Aura Intensity vs Time' },
          legend: { display: false }
        },
        scales: {
          y: {
            title: { display: true, text: 'Aura Intensity (cd)' },
            min: 0,
            max: 100
          },
          x: {
            title: { display: true, text: 'Day' }
          }
        }
      }
    });
  </script>
</body>
</html>
